<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1a1f3a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ea8ff"/>
      <stop offset="55%" stop-color="#9b8bff"/>
      <stop offset="100%" stop-color="#5fe5d6"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="160" cy="180" r="220" fill="#6ea8ff" opacity="0.55" filter="url(#blur)"/>
  <circle cx="1040" cy="500" r="240" fill="#5fe5d6" opacity="0.45" filter="url(#blur)"/>
  <circle cx="900" cy="120" r="180" fill="#9b8bff" opacity="0.5" filter="url(#blur)"/>
  <g transform="translate(120 250)">
    <text x="0" y="0" font-family="Inter, -apple-system, system-ui, sans-serif" font-weight="800" font-size="96" fill="url(#acc)">MarketCompare</text>
    <text x="0" y="80" font-family="Inter, -apple-system, system-ui, sans-serif" font-weight="500" font-size="40" fill="#e6ecff" opacity="0.85">Bir qidiruv — ko'p marketdan natija</text>
    <text x="0" y="160" font-family="Inter, -apple-system, system-ui, sans-serif" font-weight="400" font-size="28" fill="#a8b3d9" opacity="0.8">Uzum · Wildberries · Ozon · OLX · va boshqalar</text>
  </g>
