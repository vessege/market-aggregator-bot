<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MarketCompare">
  <defs>
    <linearGradient id="lg-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ea8ff">
        <animate attributeName="stop-color"
                 values="#6ea8ff;#9b8bff;#5fe5d6;#6ea8ff"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="60%" stop-color="#9b8bff">
        <animate attributeName="stop-color"
                 values="#9b8bff;#5fe5d6;#6ea8ff;#9b8bff"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#5fe5d6">
        <animate attributeName="stop-color"
                 values="#5fe5d6;#6ea8ff;#9b8bff;#5fe5d6"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="lg-s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="lg-gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#lg-g)"/>

  <!-- Roaming gloss highlight -->
  <g style="mix-blend-mode: screen; opacity: 0.65;">
    <ellipse cx="0" cy="0" rx="14" ry="22" fill="url(#lg-gloss)" transform="rotate(-20 0 0)">
      <animateTransform attributeName="transform" type="translate"
                        values="6,6; 50,12; 56,52; 8,46; 6,6"
                        dur="9s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Shopping bag body -->
  <path d="M18 22h28l-3 24a4 4 0 0 1-4 3.6H25a4 4 0 0 1-4-3.6z"
        fill="url(#lg-s)" opacity="0.95"/>
  <path d="M24 22V18a8 8 0 0 1 16 0v4" fill="none"
        stroke="#1a1f3a" stroke-width="3" stroke-linecap="round"/>

  <!-- Compare arrows: subtle pulse -->
  <g stroke="#1a1f3a" stroke-width="2.3" stroke-linecap="round" fill="none">
    <path d="M26 36 L38 36">
      <animate attributeName="stroke-dasharray" values="0 14; 14 0; 0 14" dur="3.5s" repeatCount="indefinite"/>
    </path>
    <polyline points="35,33 38,36 35,39"/>
    <polyline points="29,33 26,36 29,39"/>
  </g>
</svg>
